name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      XRAY_BASIC_AUTH_USER: ci
      XRAY_BASIC_AUTH_PASSWORD: ci-only-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Report dependency advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const a=require("/tmp/npm-audit.json"); for (const [name,v] of Object.entries(a.vulnerabilities ?? {})) console.log(JSON.stringify({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable}))'
      - name: Enforce production dependency security
        run: npm audit --omit=dev --audit-level=high
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Create database schema
        run: npx drizzle-kit push
      - name: Unit tests
        run: npm run test:unit
      - name: XLSX download integration test
        run: npm run test:integration
      - name: Build
        run: npm run build
      - name: Start app for full export smoke test
        run: |
          npm start > /tmp/xray-next.log 2>&1 &
          echo $! > /tmp/xray-next.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/xray-next.log
          exit 1
      - name: End-to-end upload → preview → apply → all exports → download
        id: e2e
        run: npm run validate:fixes
      - name: Stop app
        if: always()
        run: |
          if [ "${{ steps.e2e.outcome }}" = "failure" ]; then
            echo "=== Next.js server log after failed end-to-end validation ==="
            cat /tmp/xray-next.log || true
          fi
          if [ -f /tmp/xray-next.pid ]; then kill "$(cat /tmp/xray-next.pid)" || true; fi
